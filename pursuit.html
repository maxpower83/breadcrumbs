<!DOCTYPE html>

<style>
  :root{
    --neon-pink:#ff2fa0;
    --neon-cyan:#2ffcff;

    --neon-amber:#ffb020;
    --heat-red:#ff3b3b;
    --ink:#07070c;
    --ink2:#0d0d16;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--ink);
    overflow:hidden;
    font-family: 'Courier New', monospace;
    touch-action:none;
  }
  #game{ position:fixed; inset:0; display:block; }

  #hud{
    position:fixed; top:0; left:0; right:0;
    padding: max(12px, env(safe-area-inset-top)) 14px 0 14px;
    z-index:5; pointer-events:none;
    display:flex; flex-direction:column; gap:6px;
  }
  .hudRow{ display:flex; align-items:center; gap:10px; }
  .label{
    color:var(--neon-cyan); font-size:11px; letter-spacing:2px; width:52px;
    text-shadow:0 0 6px var(--neon-cyan);
  }
  .barTrack{
    flex:1; height:10px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15); border-radius:6px; overflow:hidden;
    position:relative;
  }
  .barFill{
    height:100%; width:0%; border-radius:6px;
    transition: width 0.12s linear, background-color .3s;
  }
  #heatFill{ background:linear-gradient(90deg,#ff8a00,var(--heat-red)); box-shadow:0 0 10px var(--heat-red); }
  #escFill{ background:linear-gradient(90deg,#0af0c0,var(--neon-cyan)); box-shadow:0 0 10px var(--neon-cyan); }
  #repVal{
    color:var(--neon-amber); font-size:13px; text-shadow:0 0 6px var(--neon-amber);
    letter-spacing:1px;
  }
  #wantedWrap{ display:flex; gap:4px; align-items:center; }
  .star{ font-size:16px; color:#2a2a35; text-shadow:none; transition:.2s; }
  .star.on{ color:var(--heat-red); text-shadow:0 0 8px var(--heat-red); }

  #centerMsg{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    color:var(--neon-pink); font-weight:bold; font-size:22px; letter-spacing:3px;
    text-shadow:0 0 14px var(--neon-pink); z-index:6; pointer-events:none;
    opacity:0; transition:opacity .25s; text-align:center;
  }
  #centerMsg.show{ opacity:1; }

  #joyBase{
    position:fixed; width:120px; height:120px; border-radius:50%;
    border:2px solid rgba(47,252,255,0.35); background:radial-gradient(circle,rgba(47,252,255,0.08),transparent 70%);
    z-index:5; display:none; pointer-events:none;
  }
  #joyStick{
    position:fixed; width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #6ffcff, #0d8f96 70%);
    box-shadow:0 0 18px var(--neon-cyan);
    z-index:6; display:none; pointer-events:none;
  }
  #joyHint{
    position:fixed; bottom:max(28px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    color:rgba(47,252,255,0.55); font-size:11px; letter-spacing:2px; z-index:4;
  }

  .screen{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #131320 0%, #050508 75%);
    text-align:center; padding:24px; gap:18px;
  }
  .hidden{ display:none !important; }
  h1{
    color:var(--neon-pink); font-size:38px; letter-spacing:6px; margin:0;
    text-shadow:0 0 10px var(--neon-pink), 0 0 30px rgba(255,47,160,0.5);
  }
  h1 span{ color:var(--neon-cyan); text-shadow:0 0 10px var(--neon-cyan), 0 0 30px rgba(47,252,255,0.5); }
  .sub{ color:#9aa; font-size:13px; letter-spacing:2px; max-width:320px; line-height:1.6; }
  .btn{
    background:transparent; border:2px solid var(--neon-cyan); color:var(--neon-cyan);
    padding:14px 34px; font-size:15px; letter-spacing:3px; border-radius:4px;
    font-family:inherit; text-shadow:0 0 8px var(--neon-cyan);
    box-shadow:0 0 14px rgba(47,252,255,0.35), inset 0 0 14px rgba(47,252,255,0.08);
    cursor:pointer;
  }
  .btn:active{ transform:scale(0.96); }
  .btn.secondary{ border-color:rgba(255,255,255,0.3); color:#ccc; text-shadow:none; box-shadow:none; padding:12px 28px; font-size:13px; }
  .btnRow{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .stat{ color:#ccc; font-size:14px; letter-spacing:1px; }
  .stat b{ color:var(--neon-amber); text-shadow:0 0 6px var(--neon-amber); }
  #busted h1{ color:var(--heat-red); text-shadow:0 0 10px var(--heat-red), 0 0 30px rgba(255,59,59,0.5); }

  #menuBtn{
    position:fixed; top:max(12px, env(safe-area-inset-top)); right:14px; z-index:7;
    background:rgba(10,10,16,0.55); border:1px solid rgba(255,255,255,0.25); color:#ccc;
    font-family:inherit; font-size:11px; letter-spacing:2px; padding:8px 12px; border-radius:4px;
  }

  #garage{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:360px; }
  .carCard{
    width:100px; padding:10px 8px; border:2px solid rgba(255,255,255,0.18); border-radius:6px;
    background:rgba(255,255,255,0.03); font-family:inherit; color:#ccc; cursor:pointer;
  }
  .carCard.selected{ border-color:var(--neon-cyan); box-shadow:0 0 12px rgba(47,252,255,0.4); }
  .carCard .swatch{ width:26px; height:26px; border-radius:50%; margin:0 auto 6px; }
  .carCard .cname{ font-size:12px; letter-spacing:1px; }
  .carCard .cstat{ font-size:9px; color:#889; margin-top:4px; letter-spacing:0.5px; }
  .carCard .ccost{ font-size:11px; color:var(--neon-amber); margin-top:6px; }
  .carCard .ctag{ font-size:10px; color:var(--neon-cyan); margin-top:6px; letter-spacing:1px; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<button id="menuBtn">⏸ MENÚ</button>

<div id="hud">
  <div class="hudRow">
    <div class="label">HEAT</div>
    <div class="barTrack"><div id="heatFill" class="barFill"></div></div>
    <div id="wantedWrap">
      <span class="star" data-i="0">★</span><span class="star" data-i="1">★</span><span class="star" data-i="2">★</span>
    </div>
  </div>
  <div class="hudRow">
    <div class="label">FUGA</div>
    <div class="barTrack"><div id="escFill" class="barFill"></div></div>
    <div id="repVal">REP 0</div>
  </div>
</div>

<div id="centerMsg"></div>
<div id="joyBase"></div>
<div id="joyStick"></div>
<div id="joyHint">MANTENÉ EL PULGAR PARA MANEJAR</div>

<div id="start" class="screen">
  <h1>CONTRABAND<br><span>RUN</span></h1>
  <div class="sub">SOBREVIVÍ A LA PERSECUCIÓN. NO HAY META, NO HAY VUELTAS.<br>SOLO VOS, LA CIUDAD Y LA POLICÍA.</div>
  <div class="stat">REPUTACIÓN: <b id="repStart">0</b></div>
  <div id="garage"></div>
  <button class="btn" id="btnStart">ARRANCAR MOTOR</button>
</div>

<div id="escaped" class="screen hidden">
  <h1>TE LES <span>PERDISTE</span></h1>
  <div class="sub" id="escapedStats"></div>
  <div class="btnRow">
    <button class="btn" id="btnAgainEsc">OTRA VUELTA</button>
    <button class="btn secondary" id="btnMenuEsc">VOLVER AL INICIO</button>
  </div>
</div>

<div id="busted" class="screen hidden">
  <h1>BUSTED</h1>
  <div class="sub" id="bustedStats"></div>
  <div class="btnRow">
    <button class="btn" id="btnAgainBust">REINTENTAR</button>
    <button class="btn secondary" id="btnMenuBust">VOLVER AL INICIO</button>
  </div>
</div>

<script>
(function(){
"use strict";

// ---------- CONFIG ----------
const CELL = 170;                 // tamaño de celda de ciudad (roads + buildings)
const ROAD_W = 78;                // ancho de calle
const VISION_R = 340;             // radio de visión (fog of war)
const SURVIVE_GOAL = 75;          // segundos "limpio" acumulados para ganar
const HEAT_MAX = 100;
const REP_KEY = "contrabandrun_rep";
const OWNED_KEY = "contrabandrun_owned";
const SELECTED_KEY = "contrabandrun_selected";

const CARS = {
  runner: { name:"RUNNER", color:"#2ffcff", cost:0,  speedMul:1.00, turnMul:1.00, tag:"EQUILIBRADO" },
  ghost:  { name:"GHOST",  color:"#b967ff", cost:40, speedMul:1.16, turnMul:0.82, tag:"VELOCIDAD" },
  tank:   { name:"TANK",   color:"#ffb020", cost:90, speedMul:0.86, turnMul:1.30, tag:"MANIOBRA" }
};

let rep = parseInt(localStorage.getItem(REP_KEY) || "0", 10);
let owned = JSON.parse(localStorage.getItem(OWNED_KEY) || '["runner"]');
let selectedCar = localStorage.getItem(SELECTED_KEY) || "runner";
if(!owned.includes(selectedCar)) selectedCar = "runner";

// ---------- CANVAS ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+"px"; canvas.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// ---------- CITY (procedural, deterministic, local — sin llamadas a red) ----------
// hash determinístico por celda
function hash2(cx, cy){
  let h = cx*374761393 + cy*668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  h = h ^ (h >> 16);
  return (h >>> 0) / 4294967295;
}

// grilla base tipo Manhattan: toda fila y columna múltiplo de 3 es calle
function baseRoadCell(cx, cy){ return (cx % 3 === 0) || (cy % 3 === 0); }
// plazas raras: alguna manzana suelta se abre entera como calle (rompe la monotonía de la grilla)
function isPlazaCell(cx, cy){
  if(baseRoadCell(cx,cy)) return false;
  return hash2(cx*53+7, cy*29+17) > 0.965;
}
// única función de la verdad para "esto es calle" — usada tanto por colisión como por el dibujo
function cellIsRoad(cx,cy){ return baseRoadCell(cx,cy) || isPlazaCell(cx,cy); }

// distrito: agrupa celdas en zonas de ~9x9 para variar paleta y densidad a medida que te alejás
function districtInfo(cx, cy){
  const dcx = Math.floor(cx/9), dcy = Math.floor(cy/9);
  const dh = hash2(dcx*31+3, dcy*17+11);
  return { hueBase: 190 + Math.floor(dh*150) }; // recorre azul -> violeta -> rosa según el distrito
}

function buildingInfo(cx, cy){
  const h = hash2(cx*7+1, cy*13+5);
  const dist = districtInfo(cx,cy);
  const isLandmark = hash2(cx*97+3, cy*61+9) > 0.93; // edificio destacado, cada tanto, sirve de referencia visual
  return {
    h: 40 + h*90,
    hue: (dist.hueBase + Math.floor(h*50) - 25 + 360) % 360,
    hasWindows: h > 0.15,
    landmark: isLandmark
  };
}

function worldToCell(x,y){ return { cx: Math.floor(x/CELL), cy: Math.floor(y/CELL) }; }

const PAD = ROAD_W/2 + 6; // debe coincidir con el "pad" usado al dibujar edificios

// resolución de colisión: coincide 1 a 1 con lo que se dibuja (edificios = rect inset en celdas no-calle)
function resolveCollision(x,y,radius){
  const cx = Math.floor(x/CELL), cy = Math.floor(y/CELL);
  if(cellIsRoad(cx,cy)) return {x,y,hit:false};
  const lx = x - cx*CELL, ly = y - cy*CELL;
  const bx0 = PAD, bx1 = CELL-PAD, by0 = PAD, by1 = CELL-PAD;
  const inside = lx > bx0-radius && lx < bx1+radius && ly > by0-radius && ly < by1+radius;
  if(!inside) return {x,y,hit:false};
  // empujar hacia el borde más cercano del edificio
  const dLeft = lx-(bx0-radius), dRight = (bx1+radius)-lx;
  const dTop = ly-(by0-radius), dBot = (by1+radius)-ly;
  const m = Math.min(dLeft,dRight,dTop,dBot);
  let nlx = lx, nly = ly;
  if(m===dLeft) nlx = bx0-radius;
  else if(m===dRight) nlx = bx1+radius;
  else if(m===dTop) nly = by0-radius;
  else nly = by1+radius;
  return { x: cx*CELL+nlx, y: cy*CELL+nly, hit:true };
}

// ---------- ENTIDADES ----------
function makeCar(x,y,color){
  return { x,y, angle:-Math.PI/2, speed:0, vx:0, vy:0, color, len:26, wid:14 };
}

let player = makeCar(0,0,'#2ffcff');
let cops = [];
const COP_COUNT = 3;
const PLAYER_MAX_SPEED_BASE = 340;
const PLAYER_ACCEL_BASE = 900;
const COP_MAX_SPEED = 300;
const COP_ACCEL = 620;
const TURN_RATE_BASE = 3.6; // rad/s a baja velocidad
let PLAYER_MAX_SPEED = PLAYER_MAX_SPEED_BASE;
let PLAYER_ACCEL = PLAYER_ACCEL_BASE;
let TURN_RATE = TURN_RATE_BASE;
function spawnCops(){
  cops = [];
  for(let i=0;i<COP_COUNT;i++){
    const ang = (i/COP_COUNT)*Math.PI*2;
    const dist = 520;
    let x = player.x + Math.cos(ang)*dist;
    let y = player.y + Math.sin(ang)*dist;
    const c = makeCar(x,y,'#ff3b3b');
    c.state = 'patrol';
    c.patrolDir = Math.random()*Math.PI*2;
    c.patrolTimer = 0;
    c.sirenPhase = Math.random()*10;
    cops.push(c);
  }
}

// ---------- INPUT: joystick dinámico de una mano ----------
const joyBase = document.getElementById('joyBase');
const joyStick = document.getElementById('joyStick');
let joy = { active:false, id:null, baseX:0, baseY:0, dx:0, dy:0, mag:0 };
const JOY_RADIUS = 60;

function joyStart(id, x, y){
  joy.active = true; joy.id = id; joy.baseX = x; joy.baseY = y; joy.dx=0; joy.dy=0; joy.mag=0;
  joyBase.style.left = (x-60)+"px"; joyBase.style.top = (y-60)+"px";
  joyBase.style.display = 'block';
  joyStick.style.left = (x-26)+"px"; joyStick.style.top = (y-26)+"px";
  joyStick.style.display = 'block';
}
function joyMove(x,y){
  if(!joy.active) return;
  let dx = x-joy.baseX, dy = y-joy.baseY;
  const d = Math.hypot(dx,dy);
  const clamped = Math.min(d, JOY_RADIUS);
  const ang = Math.atan2(dy,dx);
  const sx = joy.baseX + Math.cos(ang)*clamped;
  const sy = joy.baseY + Math.sin(ang)*clamped;
  joyStick.style.left = (sx-26)+"px"; joyStick.style.top = (sy-26)+"px";
  joy.dx = Math.cos(ang) * (clamped/JOY_RADIUS);
  joy.dy = Math.sin(ang) * (clamped/JOY_RADIUS);
  joy.mag = clamped/JOY_RADIUS;
}
function joyEnd(){
  joy.active=false; joy.id=null; joy.dx=0; joy.dy=0; joy.mag=0;
  joyBase.style.display='none'; joyStick.style.display='none';
}
canvas.addEventListener('touchstart', e=>{
  for(const t of e.changedTouches){
    if(!joy.active){ joyStart(t.identifier, t.clientX, t.clientY); }
  }
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchmove', e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joy.id) joyMove(t.clientX, t.clientY);
  }
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchend', e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joy.id) joyEnd();
  }
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchcancel', joyEnd);
// fallback mouse (para probar en desktop)
let mouseDown=false;
canvas.addEventListener('mousedown', e=>{ mouseDown=true; joyStart('m', e.clientX, e.clientY); });
window.addEventListener('mousemove', e=>{ if(mouseDown) joyMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', ()=>{ mouseDown=false; joyEnd(); });

// ---------- ESTADO DE JUEGO ----------
let heat = 0;
let escapeTimer = 0;
let elapsed = 0;
let running = false;
let camera = {x:0, y:0};

// ---------- TRÁFICO AMBIENTE (decorativo, sin colisión) ----------
const AMBIENT_TARGET = 7;
const AMBIENT_DESPAWN_DIST = 900;
let ambientCars = [];
let ambientSpawnTimer = 0;
function trySpawnAmbient(){
  if(ambientCars.length >= AMBIENT_TARGET) return;
  const pcx = Math.floor(player.x/CELL), pcy = Math.floor(player.y/CELL);
  for(let tries=0; tries<8; tries++){
    const cx = pcx + Math.floor((Math.random()-0.5)*14);
    const cy = pcy + Math.floor((Math.random()-0.5)*14);
    if(!cellIsRoad(cx,cy) || isPlazaCell(cx,cy)) continue;
    const horiz = (cy % 3 === 0), vert = (cx % 3 === 0);
    let angle;
    if(horiz && vert) angle = Math.floor(Math.random()*4)*(Math.PI/2);
    else if(horiz) angle = Math.random()<0.5 ? 0 : Math.PI;
    else angle = Math.random()<0.5 ? Math.PI/2 : -Math.PI/2;
    const x = cx*CELL + CELL/2, y = cy*CELL + CELL/2;
    if(Math.hypot(x-player.x, y-player.y) < 220) continue;
    ambientCars.push({ x, y, angle, speed: 70+Math.random()*70, color: Math.random()<0.5 ? '#8fa0b8' : '#5a6b80', len:24, wid:13 });
    break;
  }
}
function updateAmbient(dt){
  ambientSpawnTimer -= dt;
  if(ambientSpawnTimer <= 0){ trySpawnAmbient(); ambientSpawnTimer = 0.5; }
  for(let i=ambientCars.length-1; i>=0; i--){
    const c = ambientCars[i];
    c.x += Math.cos(c.angle)*c.speed*dt;
    c.y += Math.sin(c.angle)*c.speed*dt;
    if(Math.hypot(c.x-player.x, c.y-player.y) > AMBIENT_DESPAWN_DIST) ambientCars.splice(i,1);
  }
}

const heatFill = document.getElementById('heatFill');
const escFill = document.getElementById('escFill');
const repVal = document.getElementById('repVal');
const stars = document.querySelectorAll('.star');
const centerMsg = document.getElementById('centerMsg');

function flashMsg(txt, ms){
  centerMsg.textContent = txt;
  centerMsg.classList.add('show');
  clearTimeout(flashMsg._t);
  flashMsg._t = setTimeout(()=>centerMsg.classList.remove('show'), ms||900);
}

function resetGame(){
  const car = CARS[selectedCar] || CARS.runner;
  PLAYER_MAX_SPEED = PLAYER_MAX_SPEED_BASE * car.speedMul;
  PLAYER_ACCEL = PLAYER_ACCEL_BASE * car.speedMul;
  TURN_RATE = TURN_RATE_BASE * car.turnMul;
  player = makeCar(CELL*0.5, CELL*0.5, car.color);
  player.angle = -Math.PI/2;
  spawnCops();
  ambientCars = []; ambientSpawnTimer = 0;
  heat = 0; escapeTimer = 0; elapsed = 0;
  camera.x = player.x; camera.y = player.y;
}

// ---------- LOOP ----------
let lastT = null;
function update(dt){
  elapsed += dt;

  // --- player physics ---
  const targetMag = joy.mag;
  if(targetMag > 0.05){
    const desiredAngle = Math.atan2(joy.dy, joy.dx);
    let diff = desiredAngle - player.angle;
    while(diff > Math.PI) diff -= Math.PI*2;
    while(diff < -Math.PI) diff += Math.PI*2;
    const speedFactor = Math.min(1, player.speed / (PLAYER_MAX_SPEED*0.5) + 0.35);
    const maxTurn = TURN_RATE / speedFactor * dt;
    player.angle += Math.max(-maxTurn, Math.min(maxTurn, diff));
    player.speed += PLAYER_ACCEL * targetMag * dt;
  } else {
    player.speed -= PLAYER_ACCEL*1.6*dt;
  }
  player.speed = Math.max(0, Math.min(PLAYER_MAX_SPEED, player.speed));
  let nx = player.x + Math.cos(player.angle)*player.speed*dt;
  let ny = player.y + Math.sin(player.angle)*player.speed*dt;
  const res = resolveCollision(nx, ny, 10);
  if(res.hit) player.speed *= 0.55;
  player.x = res.x; player.y = res.y;

  // --- cops AI ---
  let anyVisibleChase = false;
  for(const c of cops){
    const dx = player.x-c.x, dy = player.y-c.y;
    const dist = Math.hypot(dx,dy);
    const detect = 260 + heat*2.2;
    if(dist < detect){
      c.state = 'chase';
    } else if(dist > detect + 260){
      c.state = 'patrol';
    }
    let targetAngle;
    let maxSpd = COP_MAX_SPEED;
    if(c.state==='chase'){
      if(dist < VISION_R) anyVisibleChase = true; // el heat solo cuenta si lo tenés a la vista
      targetAngle = Math.atan2(dy,dx);
      c.speed += COP_ACCEL*dt;
    } else {
      c.patrolTimer -= dt;
      if(c.patrolTimer<=0){ c.patrolDir += (Math.random()-0.5)*2.4; c.patrolTimer = 1+Math.random()*1.5; }
      targetAngle = c.patrolDir;
      maxSpd = COP_MAX_SPEED*0.45;
      c.speed += COP_ACCEL*0.5*dt;
    }
    let diff = targetAngle - c.angle;
    while(diff>Math.PI) diff-=Math.PI*2;
    while(diff<-Math.PI) diff+=Math.PI*2;
    const turn = 2.2*dt;
    c.angle += Math.max(-turn, Math.min(turn, diff));
    c.speed = Math.max(0, Math.min(maxSpd, c.speed));
    let cnx = c.x + Math.cos(c.angle)*c.speed*dt;
    let cny = c.y + Math.sin(c.angle)*c.speed*dt;
    const cres = resolveCollision(cnx,cny,10);
    if(cres.hit) c.speed *= 0.4;
    c.x = cres.x; c.y = cres.y;
    c.sirenPhase += dt*9;
  }

  // --- heat / escape ---
  if(anyVisibleChase){
    heat = Math.min(HEAT_MAX, heat + 26*dt);
    escapeTimer = Math.max(0, escapeTimer - 40*dt);
  } else {
    heat = Math.max(0, heat - 14*dt);
    if(heat < 8){ escapeTimer += dt; }
  }

  updateAmbient(dt);

  // --- camera ---
  camera.x += (player.x-camera.x)*Math.min(1, dt*6);
  camera.y += (player.y-camera.y)*Math.min(1, dt*6);

  // --- HUD ---
  heatFill.style.width = heat+"%";
  escFill.style.width = Math.min(100, (escapeTimer/SURVIVE_GOAL)*100)+"%";
  repVal.textContent = "REP " + rep;
  const wanted = heat>66?3:heat>30?2:heat>4?1:0;
  stars.forEach((s,i)=> s.classList.toggle('on', i<wanted));

  // --- win/lose ---
  if(heat >= HEAT_MAX){ endGame(false); }
  if(escapeTimer >= SURVIVE_GOAL){ endGame(true); }
}

// ---------- RENDER ----------
function draw(){
  ctx.fillStyle = '#07070c';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2 - camera.x, H/2 - camera.y);

  const viewPad = 260;
  const minCX = Math.floor((camera.x - W/2 - viewPad)/CELL);
  const maxCX = Math.floor((camera.x + W/2 + viewPad)/CELL);
  const minCY = Math.floor((camera.y - H/2 - viewPad)/CELL);
  const maxCY = Math.floor((camera.y + H/2 + viewPad)/CELL);

  // asfalto base
  ctx.fillStyle = '#0d0d16';
  ctx.fillRect(camera.x-W/2-viewPad, camera.y-H/2-viewPad, W+viewPad*2, H+viewPad*2);

  for(let cx=minCX; cx<=maxCX; cx++){
    for(let cy=minCY; cy<=maxCY; cy++){
      const px = cx*CELL, py = cy*CELL;
      if(!cellIsRoad(cx,cy)){
        const info = buildingInfo(cx,cy);
        const bx = px+PAD, by = py+PAD, bs = CELL-PAD*2;
        // sombra
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(bx+6, by+6, bs, bs);
        // edificio
        ctx.fillStyle = `hsl(${info.hue}, 35%, ${10+info.h*0.06}%)`;
        ctx.fillRect(bx, by, bs, bs);
        ctx.strokeStyle = info.landmark ? `hsla(${info.hue},90%,65%,0.55)` : `hsla(${info.hue},60%,55%,0.18)`;
        ctx.lineWidth = info.landmark ? 3 : 2;
        ctx.strokeRect(bx,by,bs,bs);
        if(info.hasWindows){
          ctx.fillStyle = 'rgba(255,200,90,0.10)';
          const step = 16;
          for(let wx=bx+8; wx<bx+bs-8; wx+=step){
            for(let wy=by+8; wy<by+bs-8; wy+=step){
              if(hash2(Math.floor(wx),Math.floor(wy)) > 0.55){
                ctx.fillStyle = 'rgba(255,190,80,0.22)';
                ctx.fillRect(wx,wy,5,5);
              }
            }
          }
        }
        if(info.landmark){
          // cartel de neón en el techo — sirve de referencia visual a la distancia
          ctx.save();
          ctx.shadowColor = `hsl(${info.hue},90%,60%)`;
          ctx.shadowBlur = 24;
          ctx.fillStyle = `hsl(${info.hue},90%,60%)`;
          ctx.fillRect(bx+bs/2-3, by-14, 6, 14);
          ctx.beginPath();
          ctx.arc(bx+bs/2, by-16, 7, 0, Math.PI*2);
          ctx.fill();
          ctx.restore();
        }
      } else if(isPlazaCell(cx,cy)){
        // plaza abierta: piso distinto para que se note que es un claro, no una calle común
        ctx.fillStyle = 'rgba(47,252,255,0.03)';
        ctx.fillRect(px+6, py+6, CELL-12, CELL-12);
        ctx.strokeStyle = 'rgba(47,252,255,0.08)';
        ctx.lineWidth = 1;
        ctx.strokeRect(px+6, py+6, CELL-12, CELL-12);
      }
    }
  }
  // lineas de calle (guías centrales)
  ctx.strokeStyle = 'rgba(47,252,255,0.06)';
  ctx.lineWidth = 2;
  for(let cx=minCX; cx<=maxCX; cx++){
    if(cx%3===0){
      ctx.beginPath(); ctx.moveTo(cx*CELL, minCY*CELL); ctx.lineTo(cx*CELL, (maxCY+1)*CELL); ctx.stroke();
    }
  }
  for(let cy=minCY; cy<=maxCY; cy++){
    if(cy%3===0){
      ctx.beginPath(); ctx.moveTo(minCX*CELL, cy*CELL); ctx.lineTo((maxCX+1)*CELL, cy*CELL); ctx.stroke();
    }
  }

  // tráfico ambiente (decorativo)
  for(const c of ambientCars){
    drawCar(c, c.color, false);
  }
  // cops
  for(const c of cops){
    drawCar(c, c.color, true);
  }
  // player
  drawCar(player, player.color, false);

  ctx.restore();

  // fog of war (radial, en espacio pantalla porque el player siempre está centrado)
  const grad = ctx.createRadialGradient(W/2,H/2, VISION_R*0.35, W/2,H/2, VISION_R);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.94)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(0,0,0,0.94)';
  // asegurar oscuridad total fuera del radio en pantallas grandes
  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,W,H);
  ctx.arc(W/2,H/2,VISION_R,0,Math.PI*2,true);
  ctx.fill('evenodd');
  ctx.restore();

  // viñeta
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
}

function drawCar(c, color, isCop){
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.angle);
  ctx.shadowColor = color;
  ctx.shadowBlur = isCop ? 14 : 18;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(c.len/2, 0);
  ctx.lineTo(-c.len/2, c.wid/2);
  ctx.lineTo(-c.len/2, -c.wid/2);
  ctx.closePath();
  ctx.fill();
  if(isCop){
    const on = Math.sin(c.sirenPhase) > 0;
    ctx.shadowBlur = 20;
    ctx.fillStyle = on ? '#ff3b3b' : '#3b6bff';
    ctx.beginPath(); ctx.arc(-2, on?-6:6, 3.4, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ---------- MAIN LOOP ----------
function frame(t){
  if(lastT===null) lastT=t;
  let dt = (t-lastT)/1000;
  lastT = t;
  dt = Math.min(dt, 0.05);
  if(running) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- SCREENS ----------
const elStart = document.getElementById('start');
const elEsc = document.getElementById('escaped');
const elBust = document.getElementById('busted');
const garageEl = document.getElementById('garage');
const repStartEl = document.getElementById('repStart');

function hideAllScreens(){
  [elStart, elEsc, elBust].forEach(s=>s.classList.add('hidden'));
}
function showScreen(el){
  hideAllScreens();
  el.classList.remove('hidden');
}

function renderGarage(){
  repStartEl.textContent = rep;
  garageEl.innerHTML = '';
  Object.keys(CARS).forEach(id=>{
    const car = CARS[id];
    const isOwned = owned.includes(id);
    const isSelected = id === selectedCar;
    const card = document.createElement('button');
    card.className = 'carCard' + (isSelected ? ' selected' : '');
    card.dataset.id = id;
    card.innerHTML = `
      <div class="swatch" style="background:${car.color}; box-shadow:0 0 10px ${car.color}"></div>
      <div class="cname">${car.name}</div>
      <div class="cstat">${car.tag}</div>
      ${isSelected ? '<div class="ctag">EN USO</div>' : isOwned ? '<div class="ctag">USAR</div>' : `<div class="ccost">REP ${car.cost}</div>`}
    `;
    garageEl.appendChild(card);
  });
}
garageEl.addEventListener('click', (e)=>{
  const card = e.target.closest('.carCard');
  if(!card) return;
  const id = card.dataset.id;
  const car = CARS[id];
  if(owned.includes(id)){
    selectedCar = id;
    localStorage.setItem(SELECTED_KEY, id);
  } else if(rep >= car.cost){
    rep -= car.cost;
    owned.push(id);
    selectedCar = id;
    localStorage.setItem(REP_KEY, String(rep));
    localStorage.setItem(OWNED_KEY, JSON.stringify(owned));
    localStorage.setItem(SELECTED_KEY, id);
  } else {
    flashMsg('REP INSUFICIENTE', 700);
    return;
  }
  renderGarage();
});

function goToMenu(){
  running = false;
  joyEnd();
  renderGarage();
  showScreen(elStart);
}

function startGame(){
  resetGame();
  running = true;
  hideAllScreens();
}

function endGame(won){
  running = false;
  joyEnd();
  const gained = won ? (10 + Math.floor(elapsed/3)) : Math.floor(elapsed/6);
  rep += gained;
  localStorage.setItem(REP_KEY, String(rep));
  if(won){
    document.getElementById('escapedStats').innerHTML =
      `SOBREVIVISTE ${Math.floor(elapsed)}s ESQUIVANDO A LA CANA.<br>REPUTACIÓN GANADA: <b style="color:var(--neon-amber)">+${gained}</b>`;
    showScreen(elEsc);
  } else {
    document.getElementById('bustedStats').innerHTML =
      `TE AGARRARON DESPUÉS DE ${Math.floor(elapsed)}s.<br>REPUTACIÓN GANADA: <b style="color:var(--neon-amber)">+${gained}</b>`;
    showScreen(elBust);
  }
}

document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnAgainEsc').addEventListener('click', startGame);
document.getElementById('btnAgainBust').addEventListener('click', startGame);
document.getElementById('btnMenuEsc').addEventListener('click', goToMenu);
document.getElementById('btnMenuBust').addEventListener('click', goToMenu);
document.getElementById('menuBtn').addEventListener('click', goToMenu);

// estado inicial
resetGame();
renderGarage();
showScreen(elStart);

})();
</script>
