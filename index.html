<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>índice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10121b;
    --panel: #171a26;
    --panel-border: #262a3d;
    --text: #d9dcec;
    --text-dim: #6b7086;
    --accent: #f2b134;
    --accent-dim: #8a6a24;
    --ok: #6fd08c;
    --err: #e0616b;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    min-height:100vh;
  }
  body{
    display:flex;
    justify-content:center;
    padding: 8vh 20px 6vh;
  }
  .window{
    width:100%;
    max-width: 760px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.6);
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 12px 16px;
    background: #14172200;
    border-bottom: 1px solid var(--panel-border);
  }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#e0616b55; border:1px solid #e0616b; }
  .dot.y{ background:#f2b13455; border:1px solid #f2b134; }
  .dot.g{ background:#6fd08c55; border:1px solid #6fd08c; }
  .titlebar span{
    margin-left: 10px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }
  .screen{ padding: 22px 24px 26px; }
  .prompt{
    font-size: 14px;
    color: var(--text-dim);
    margin: 0 0 4px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .prompt .sym{ color: var(--accent); }
  .prompt .path{ color: var(--text); }
  .cursor{
    display:inline-block;
    width: 8px; height: 15px;
    background: var(--accent);
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  h1{
    font-size: 15px;
    font-weight: 600;
    margin: 18px 0 14px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  h1 .count{ color: var(--accent); }
  ul{ list-style:none; margin:0; padding:0; }
  li{
    border-top: 1px solid var(--panel-border);
  }
  li:last-child{ border-bottom: 1px solid var(--panel-border); }
  a.row{
    display:flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 6px;
    text-decoration:none;
    color: var(--text);
    transition: background 0.12s ease, padding-left 0.12s ease;
  }
  a.row:hover{
    background: #1e2233;
    padding-left: 12px;
  }
  a.row:hover .name{ color: var(--accent); }
  .name{
    font-weight: 600;
    font-size: 14px;
  }
  .sep{ display:none; }
  .doctitle{
    font-size: 13px;
    color: var(--text-dim);
    white-space: normal;
    word-break: break-word;
  }
  .doctitle::before{
    content: "› ";
    color: var(--accent-dim);
  }
  .status{
    font-size: 13px;
    color: var(--text-dim);
    padding: 10px 6px;
  }
  .status.err{ color: var(--err); }
  .status .sym{ color: var(--accent); }
  footer{
    margin-top: 20px;
    font-size: 11px;
    color: var(--text-dim);
    opacity: 0.7;
  }
  @media (prefers-reduced-motion: reduce){
    .cursor{ animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <span>directorio</span>
    </div>
    <div class="screen">
      <p class="prompt"><span class="sym">$</span> <span class="path" id="prompt-path">ls *.html</span><span class="cursor"></span></p>
      <h1 id="heading">buscando archivos…</h1>
      <ul id="list"></ul>
      <footer>generado automáticamente al cargar la página, vía GitHub API</footer>
    </div>
  </div>

<script>
(async function(){
  const listEl = document.getElementById('list');
  const headingEl = document.getElementById('heading');
  const promptPathEl = document.getElementById('prompt-path');

  function statusLine(text, isErr){
    const li = document.createElement('li');
    li.innerHTML = `<div class="status ${isErr ? 'err' : ''}"><span class="sym">#</span> ${text}</div>`;
    listEl.appendChild(li);
  }

  function pathPartsFromLocation(){
    let parts = location.pathname.split('/').filter(Boolean);
    if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
    return parts;
  }

  async function tryListDir(owner, repo, dirParts, branch){
    const dirPath = dirParts.join('/');
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${dirPath}${branch ? `?ref=${branch}` : ''}`;
    const res = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('no es un directorio');
    return { data, owner, repo, dirPath, branch: branch || data[0]?.ref };
  }

  async function resolveRepoListing(){
    const hostname = location.hostname;
    if (!hostname.endsWith('.github.io')){
      throw new Error('esta página no está en un dominio *.github.io; la API de GitHub no puede inferir el repositorio automáticamente.');
    }
    const userLogin = hostname.split('.')[0];
    const parts = pathPartsFromLocation();

    // Intento 1: sitio de usuario/organización -> repo = "<login>.github.io", carpeta = ruta completa
    try {
      return await tryListDir(userLogin, hostname, parts, null);
    } catch (e1) {
      // Intento 2: sitio de proyecto -> repo = primer segmento de la ruta, carpeta = el resto
      if (parts.length){
        try {
          return await tryListDir(userLogin, parts[0], parts.slice(1), null);
        } catch (e2) { /* sigue abajo */ }
      }
      throw new Error('no se pudo ubicar el repositorio o la carpeta vía GitHub API.');
    }
  }

  async function extractTitle(rawUrl){
    try {
      const res = await fetch(rawUrl);
      if (!res.ok) return null;
      const html = await res.text();
      const match = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
      if (!match) return null;
      const txt = document.createElement('textarea');
      txt.innerHTML = match[1].trim();
      return txt.value || null;
    } catch (e) {
      return null;
    }
  }

  try {
    const { data, owner, repo, dirPath } = await resolveRepoListing();
    promptPathEl.textContent = `ls ${dirPath ? '/' + dirPath + '/' : '/'}*.html`;

    const files = data
      .filter(item => item.type === 'file')
      .filter(item => /\.html?$/i.test(item.name))
      .filter(item => item.name.toLowerCase() !== 'index.html')
      .sort((a, b) => a.name.localeCompare(b.name));

    if (!files.length){
      headingEl.innerHTML = `0 archivos encontrados`;
      statusLine('no hay otros archivos .html en este directorio.', false);
      return;
    }

    headingEl.innerHTML = `<span class="count">${files.length}</span> archivo${files.length === 1 ? '' : 's'} encontrado${files.length === 1 ? '' : 's'}`;

    for (const file of files){
      const li = document.createElement('li');
      li.innerHTML = `
        <a class="row" href="${file.name}">
          <span class="name">${file.name}</span>
          <span class="sep">—</span>
          <span class="doctitle">cargando título…</span>
        </a>`;
      listEl.appendChild(li);

      extractTitle(file.download_url).then(title => {
        const el = li.querySelector('.doctitle');
        if (title) {
          el.textContent = title;
        } else {
          el.textContent = 'sin título';
          el.style.opacity = '0.5';
        }
      });
    }
  } catch (err) {
    headingEl.textContent = 'error';
    statusLine(err.message || 'ocurrió un error al listar los archivos.', true);
  }
})();
</script>
</body>
</html>
