<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>índice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10121b;
    --panel: #171a26;
    --panel-border: #262a3d;
    --text: #d9dcec;
    --text-dim: #6b7086;
    --accent: #f2b134;
    --accent-dim: #8a6a24;
    --ok: #6fd08c;
    --err: #e0616b;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    min-height:100vh;
  }
  body{
    display:flex;
    justify-content:center;
    padding: 8vh 20px 6vh;
  }
  .window{
    width:100%;
    max-width: 760px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.6);
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 12px 16px;
    background: #14172200;
    border-bottom: 1px solid var(--panel-border);
  }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#e0616b55; border:1px solid #e0616b; }
  .dot.y{ background:#f2b13455; border:1px solid #f2b134; }
  .dot.g{ background:#6fd08c55; border:1px solid #6fd08c; }
  .titlebar span{
    margin-left: 10px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }
  .screen{ padding: 22px 24px 26px; }
  .prompt{
    font-size: 14px;
    color: var(--text-dim);
    margin: 0 0 4px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .prompt .sym{ color: var(--accent); }
  .prompt .path{ color: var(--text); }
  .cursor{
    display:inline-block;
    width: 8px; height: 15px;
    background: var(--accent);
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  h1{
    font-size: 15px;
    font-weight: 600;
    margin: 18px 0 14px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  h1 .count{ color: var(--accent); }
  .category{
    margin: 22px 0 0;
  }
  .category:first-of-type{ margin-top: 0; }
  .category-label{
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin: 0 0 6px;
    padding: 0 6px;
  }
  .category-label::before{ content: "# "; color: var(--accent-dim); }
  ul{ list-style:none; margin:0; padding:0; }
  li{
    border-top: 1px solid var(--panel-border);
  }
  li:last-child{ border-bottom: 1px solid var(--panel-border); }
  a.row{
    display:flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 6px;
    text-decoration:none;
    color: var(--text);
    transition: background 0.12s ease, padding-left 0.12s ease;
  }
  a.row:hover{
    background: #1e2233;
    padding-left: 12px;
  }
  a.row:hover .name{ color: var(--accent); }
  .name{
    font-weight: 600;
    font-size: 14px;
  }
  .sep{ display:none; }
  .doctitle{
    font-size: 13px;
    color: var(--text-dim);
    white-space: normal;
    word-break: break-word;
  }
  .doctitle::before{
    content: "› ";
    color: var(--accent-dim);
  }
  .status{
    font-size: 13px;
    color: var(--text-dim);
    padding: 10px 6px;
  }
  .status.err{ color: var(--err); }
  .status .sym{ color: var(--accent); }
  .cachebar{
    margin: 16px 0 0;
    font-size: 12px;
    color: var(--text-dim);
  }
  .cachebar a{
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px dotted var(--accent-dim);
  }
  .cachebar a:hover{ color: #ffce6b; }
  footer{
    margin-top: 10px;
    font-size: 11px;
    color: var(--text-dim);
    opacity: 0.7;
  }
  @media (prefers-reduced-motion: reduce){
    .cursor{ animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <span>directorio</span>
    </div>
    <div class="screen">
      <p class="prompt"><span class="sym">$</span> <span class="path" id="prompt-path">ls *.html</span><span class="cursor"></span></p>
      <h1 id="heading">buscando archivos…</h1>
      <div id="list"></div>
      <p class="cachebar" id="cachebar"></p>
      <footer>generado automáticamente al cargar la página, vía GitHub API</footer>
    </div>
  </div>

<script>
(async function(){
  const listEl = document.getElementById('list');
  const headingEl = document.getElementById('heading');
  const promptPathEl = document.getElementById('prompt-path');
  const cachebarEl = document.getElementById('cachebar');

  const CACHE_KEY = 'gh-html-index:' + location.hostname + location.pathname;
  const CACHE_SCHEMA_VERSION = 2; // subir este número invalida cachés viejas (ej. al agregar nuevos campos por archivo)
  const CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 horas: dentro de este lapso no se consulta la API en absoluto
  const forceRefresh = location.hash === '#refresh';

  function readCache(){
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.files)) return null;
      if (parsed.v !== CACHE_SCHEMA_VERSION) return null; // esquema desactualizado: se ignora y se relee todo una vez
      return parsed;
    } catch (e) { return null; }
  }

  function writeCache(cache){
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ...cache, v: CACHE_SCHEMA_VERSION })); } catch (e) { /* localStorage lleno o no disponible: seguir sin cachear */ }
  }

  function timeAgo(ts){
    const diffMin = Math.round((Date.now() - ts) / 60000);
    if (diffMin < 1) return 'recién';
    if (diffMin < 60) return `hace ${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `hace ${diffH} h`;
    return `hace ${Math.round(diffH / 24)} d`;
  }

  function renderCachebar(cache, fromCacheOnly){
    const parts = [];
    if (cache) parts.push(`índice ${fromCacheOnly ? 'servido desde caché' : 'actualizado'} · ${timeAgo(cache.ts)}`);
    parts.push('<a href="#" id="refresh-link">revisar ahora</a>');
    cachebarEl.innerHTML = parts.join(' — ');
    const link = document.getElementById('refresh-link');
    if (link){
      link.addEventListener('click', (ev) => {
        ev.preventDefault();
        try { localStorage.removeItem(CACHE_KEY); } catch (e) { /* nada que limpiar */ }
        location.reload();
      });
    }
  }

  const NO_CATEGORY = 'sin categoría';

  function renderFiles(files){
    listEl.innerHTML = '';
    if (!files.length){
      headingEl.innerHTML = `0 archivos encontrados`;
      statusLine('no hay otros archivos .html en este directorio.', false);
      return;
    }
    headingEl.innerHTML = `<span class="count">${files.length}</span> archivo${files.length === 1 ? '' : 's'} encontrado${files.length === 1 ? '' : 's'}`;

    const groups = new Map();
    for (const file of files){
      const cat = file.category || NO_CATEGORY;
      if (!groups.has(cat)) groups.set(cat, []);
      groups.get(cat).push(file);
    }
    const sortedCats = [...groups.keys()].sort((a, b) => {
      if (a === NO_CATEGORY) return 1;
      if (b === NO_CATEGORY) return -1;
      return a.localeCompare(b);
    });

    for (const cat of sortedCats){
      const section = document.createElement('div');
      section.className = 'category';
      const label = document.createElement('p');
      label.className = 'category-label';
      label.textContent = cat;
      section.appendChild(label);

      const ul = document.createElement('ul');
      for (const file of groups.get(cat)){
        const li = document.createElement('li');
        const titleHtml = file.title
          ? `<span class="doctitle">${file.title}</span>`
          : file.pending
            ? `<span class="doctitle" style="opacity:.5">cargando título…</span>`
            : `<span class="doctitle" style="opacity:.5">sin título</span>`;
        li.innerHTML = `
          <a class="row" href="${file.name}">
            <span class="name">${file.name}</span>
            ${titleHtml}
          </a>`;
        ul.appendChild(li);
      }
      section.appendChild(ul);
      listEl.appendChild(section);
    }
  }

  function statusLine(text, isErr){
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="status ${isErr ? 'err' : ''}"><span class="sym">#</span> ${text}</div>`;
    listEl.appendChild(wrap);
  }

  function pathPartsFromLocation(){
    let parts = location.pathname.split('/').filter(Boolean);
    if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
    return parts;
  }

  async function tryListDir(owner, repo, dirParts, branch){
    const dirPath = dirParts.join('/');
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${dirPath}${branch ? `?ref=${branch}` : ''}`;
    const res = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('no es un directorio');
    return { data, owner, repo, dirPath, branch: branch || data[0]?.ref };
  }

  async function resolveRepoListing(){
    const hostname = location.hostname;
    if (!hostname.endsWith('.github.io')){
      throw new Error('esta página no está en un dominio *.github.io; la API de GitHub no puede inferir el repositorio automáticamente.');
    }
    const userLogin = hostname.split('.')[0];
    const parts = pathPartsFromLocation();

    // Intento 1: sitio de usuario/organización -> repo = "<login>.github.io", carpeta = ruta completa
    try {
      return await tryListDir(userLogin, hostname, parts, null);
    } catch (e1) {
      // Intento 2: sitio de proyecto -> repo = primer segmento de la ruta, carpeta = el resto
      if (parts.length){
        try {
          return await tryListDir(userLogin, parts[0], parts.slice(1), null);
        } catch (e2) { /* sigue abajo */ }
      }
      throw new Error('no se pudo ubicar el repositorio o la carpeta vía GitHub API.');
    }
  }

  async function extractMeta(rawUrl){
    try {
      const res = await fetch(rawUrl);
      if (!res.ok) return { title: null, category: null };
      const html = await res.text();

      let title = null;
      const titleMatch = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
      if (titleMatch){
        const txt = document.createElement('textarea');
        txt.innerHTML = titleMatch[1].trim();
        title = txt.value || null;
      }

      let category = null;
      const metaMatch = html.match(/<meta[^>]+name=["']category["'][^>]*>/i);
      if (metaMatch){
        const contentMatch = metaMatch[0].match(/content=["']([^"']*)["']/i);
        if (contentMatch){
          const txt = document.createElement('textarea');
          txt.innerHTML = contentMatch[1].trim();
          category = txt.value || null;
        }
      }

      return { title, category };
    } catch (e) {
      return { title: null, category: null };
    }
  }

  try {
    const cache = readCache();

    // 1) Caché fresca dentro del TTL: renderizar directo, cero requests.
    if (cache && !forceRefresh && (Date.now() - cache.ts) < CACHE_TTL_MS){
      promptPathEl.textContent = `ls ${cache.dirPath ? '/' + cache.dirPath + '/' : '/'}*.html`;
      renderFiles(cache.files);
      renderCachebar(cache, true);
      return;
    }

    // 2) Caché vencida o inexistente: un solo request para listar el directorio.
    const { data, dirPath } = await resolveRepoListing();
    promptPathEl.textContent = `ls ${dirPath ? '/' + dirPath + '/' : '/'}*.html`;

    const current = data
      .filter(item => item.type === 'file')
      .filter(item => /\.html?$/i.test(item.name))
      .filter(item => item.name.toLowerCase() !== 'index.html')
      .sort((a, b) => a.name.localeCompare(b.name));

    const prevByName = forceRefresh ? new Map() : new Map((cache?.files || []).map(f => [f.name, f]));

    // Render inmediato con lo que ya se sabe (título/categoría "cargando…" solo para lo nuevo/cambiado)
    renderFiles(current.map(f => {
      const prev = prevByName.get(f.name);
      const unchanged = prev && prev.sha === f.sha;
      return { name: f.name, title: unchanged ? prev.title : null, category: unchanged ? prev.category : null, sha: f.sha, pending: !unchanged };
    }));

    // 3) Solo se hace fetch del contenido en archivos nuevos o con sha distinto al cacheado.
    const finalFiles = [];
    let pendingCount = 0;
    for (const f of current){
      const prev = prevByName.get(f.name);
      if (prev && prev.sha === f.sha){
        finalFiles.push({ name: f.name, sha: f.sha, title: prev.title, category: prev.category });
      } else {
        pendingCount++;
        finalFiles.push({ name: f.name, sha: f.sha, title: null, category: null });
      }
    }

    if (pendingCount){
      const metaPromises = current.map(async (f, i) => {
        const prev = prevByName.get(f.name);
        if (prev && prev.sha === f.sha) return; // sin cambios: no se pide de nuevo
        const { title, category } = await extractMeta(f.download_url);
        finalFiles[i].title = title;
        finalFiles[i].category = category;
      });
      await Promise.all(metaPromises);
      // Con categorías ya resueltas, se re-renderiza agrupado correctamente.
      renderFiles(finalFiles);
    }

    const newCache = { ts: Date.now(), dirPath, files: finalFiles };
    writeCache(newCache);
    renderCachebar(newCache, false);
  } catch (err) {
    // Si falla la API (p. ej. límite de requests alcanzado) pero hay caché vieja, se usa como respaldo.
    const staleCache = readCache();
    if (staleCache){
      promptPathEl.textContent = `ls ${staleCache.dirPath ? '/' + staleCache.dirPath + '/' : '/'}*.html`;
      renderFiles(staleCache.files);
      renderCachebar(staleCache, true);
      statusLine(`no se pudo actualizar (${err.message || 'error'}); mostrando caché.`, true);
      return;
    }
    headingEl.textContent = 'error';
    statusLine(err.message || 'ocurrió un error al listar los archivos.', true);
  }
})();
</script>
</body>
</html>
