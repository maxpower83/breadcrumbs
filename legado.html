<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="category" content="games">
<title>Legado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#182821; --panel:#20302A; --panel-2:#2A3E35; --line:#3A5148;
    --text:#EDE6D3; --text-dim:#A9B6A9;
    --accent:#C98A3E; --accent-soft:#4A3A25;
    --good:#8FAE7F; --warn:#CDB35A; --danger:#C1553C;
    --transition-mode: background-color .9s ease, color .9s ease;
  }
  body.paranormal{
    --bg:#100E17; --panel:#1B1826; --panel-2:#241F33; --line:#3A3350;
    --text:#D7D2E4; --text-dim:#8A82A3;
    --accent:#6FCFC4; --accent-soft:#233B3D;
    --good:#7FBFC7; --warn:#C9A6D9; --danger:#8B3A5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:'Work Sans',sans-serif; transition:var(--transition-mode);
    display:flex; justify-content:center;
  }
  #app{ width:100%; max-width:460px; padding:24px 20px 60px; }
  .eyebrow{ font-size:13px; color:var(--text-dim); letter-spacing:.02em; margin:0 0 2px; }
  h1.name{
    font-family:'Fraunces',serif; font-weight:500; font-style:italic;
    font-size:32px; margin:0 0 4px; line-height:1.1; transition:color .9s ease;
  }
  .meta-line{ font-size:13px; color:var(--text-dim); margin-bottom:8px; }
  .traits{ display:flex; flex-direction:column; gap:5px; margin-bottom:18px; }
  .trait{
    font-size:11px; padding:5px 9px; border:1px solid var(--line); border-radius:2px;
    color:var(--text-dim); display:flex; gap:6px; align-items:baseline; width:fit-content;
  }
  .trait b{ color:var(--text); font-weight:500; }
  .trait-curse{ border-color:var(--danger); } .trait-curse b{ color:var(--danger); }
  .trait-blessing{ border-color:var(--accent); } .trait-blessing b{ color:var(--accent); }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; }
  .iconbtn{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    font-family:'Work Sans',sans-serif; font-size:12px; padding:6px 10px;
    border-radius:3px; cursor:pointer;
  }
  .iconbtn:hover{ color:var(--text); border-color:var(--accent); }

  .stage{
    position:relative; height:150px; display:flex; align-items:center; justify-content:center;
    margin:10px 0 22px;
  }
  .blob{
    position:relative;
    width:104px; height:104px;
    border-radius:42% 58% 61% 39% / 45% 40% 60% 55%;
    background:var(--blob-color, var(--good));
    box-shadow:0 0 40px -6px var(--blob-color, var(--good));
    transition:background .6s ease, box-shadow .6s ease, border-radius .8s ease;
    animation:breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ transform:scale(1) rotate(0deg);} 50%{ transform:scale(1.045) rotate(2deg);} }

  .creature-wrap{ display:inline-block; transition:transform .8s ease, filter .8s ease; }
  .creature-wrap.stage-cria{ transform:scale(.66); }
  .creature-wrap.stage-joven{ transform:scale(.84); }
  .creature-wrap.stage-adulta{ transform:scale(1); }
  .creature-wrap.stage-anciana{ transform:scale(.9); filter:saturate(.55) brightness(.84); }

  .blob.domain-animal{ border-radius:44% 56% 40% 60% / 60% 50% 50% 40%; }
  .blob.domain-animal::before, .blob.domain-animal::after{
    content:''; position:absolute; top:-13px; width:20px; height:24px;
    background:var(--blob-color, var(--good)); border-radius:60% 60% 8% 8%;
  }
  .blob.domain-animal::before{ left:6px; transform:rotate(-20deg); }
  .blob.domain-animal::after{ right:6px; transform:rotate(20deg); }

  .blob.domain-alien{ border-radius:15% 85% 30% 70% / 65% 25% 75% 35%; }
  .blob.domain-alien::before{
    content:''; position:absolute; top:-26px; left:50%; width:3px; height:22px;
    background:var(--blob-color, var(--good)); transform:translateX(-50%); border-radius:2px;
  }
  .blob.domain-alien::after{
    content:''; position:absolute; top:-33px; left:50%; width:9px; height:9px;
    background:var(--blob-color, var(--good)); border-radius:50%; transform:translateX(-50%);
    box-shadow:0 0 10px var(--blob-color, var(--good));
  }

  .blob.domain-humana{ border-radius:50% 50% 46% 46% / 62% 62% 38% 38%; }
  .blob.domain-humana::before, .blob.domain-humana::after{
    content:''; position:absolute; top:36%; width:7px; height:7px; border-radius:50%; background:var(--bg);
  }
  .blob.domain-humana::before{ left:30%; }
  .blob.domain-humana::after{ right:30%; }

  .blob.domain-paranormal{ border-radius:38% 62% 58% 42% / 68% 55% 45% 32%; opacity:.85; animation:breathe 3.6s ease-in-out infinite, flicker 2.4s ease-in-out infinite; }
  .blob.domain-paranormal::before{
    content:''; position:absolute; inset:-14px; border-radius:50%;
    border:1px solid var(--blob-color, var(--good)); opacity:.35;
    animation:ringpulse 3s ease-in-out infinite;
  }
  @keyframes flicker{ 0%,100%{ opacity:.85;} 50%{ opacity:.6;} }
  @keyframes ringpulse{ 0%,100%{ transform:scale(1); opacity:.35;} 50%{ transform:scale(1.2); opacity:.08;} }

  .status-text{ text-align:center; font-size:14px; color:var(--text-dim); font-style:italic; margin:-8px 0 22px; min-height:18px; }

  .illness-banner{
    border:1px solid var(--danger); color:var(--danger); font-size:13px;
    padding:8px 10px; margin-bottom:16px; border-radius:2px;
  }

  .needs{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .need-row{ display:flex; align-items:center; gap:10px; }
  .need-label{ width:64px; font-size:12px; color:var(--text-dim); flex-shrink:0; }
  .need-track{
    flex:1; height:7px; background:var(--panel-2); position:relative; overflow:hidden;
    clip-path:polygon(0 0,100% 0,98% 100%,2% 100%);
  }
  .need-fill{ height:100%; background:var(--good); transition:width .5s ease, background .5s ease; }

  .bond-line{ font-size:13px; color:var(--text-dim); margin-bottom:22px; }
  .bond-line b{ color:var(--text); font-weight:500; }

  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  button.act{
    font-family:'Work Sans',sans-serif; font-size:14px; font-weight:500;
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    padding:13px 10px; border-radius:3px; cursor:pointer; transition:border-color .2s, background .2s;
  }
  button.act:hover{ border-color:var(--accent); background:var(--panel-2); }
  button.act:disabled{ opacity:.35; cursor:default; }
  button.primary{ background:var(--accent-soft); border-color:var(--accent); }

  .panel{ background:var(--panel); border:1px solid var(--line); padding:20px; margin-top:10px; }
  .panel h2{ font-family:'Fraunces',serif; font-weight:500; font-size:20px; margin:0 0 10px; }
  .panel p{ font-size:14px; line-height:1.55; color:var(--text-dim); margin:0 0 14px; }
  .panel input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    font-family:'Fraunces',serif; font-size:18px; padding:10px 12px; margin-bottom:14px; border-radius:2px;
  }

  .lineage-item{ border-bottom:1px solid var(--line); padding:10px 0; font-size:13px; }
  .lineage-item .g{ color:var(--text-dim); }
  .lineage-item.forgotten{ opacity:.45; font-style:italic; }

  .devbox{ margin-top:34px; border-top:1px dashed var(--line); padding-top:14px; }
  .devbox summary{ font-size:11px; color:var(--text-dim); cursor:pointer; }
  .devrow{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .devrow button{ font-size:11px; padding:6px 8px; background:var(--panel); border:1px solid var(--line); color:var(--text-dim); border-radius:2px; cursor:pointer; }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ======================= CORE (motor puro) =======================
const NEEDS = ['hambre','energia','higiene','social','salud','cordura'];
const NEED_LABELS = { hambre:'Hambre', energia:'Energía', higiene:'Higiene', social:'Vínculo', salud:'Salud', cordura:'Cordura' };

const SPECIES_POOL = [
  { id:'criatura_pelaje', label:'una criatura de pelaje espeso', domain:'animal' },
  { id:'reptil_escamas', label:'un pequeño reptil de escamas iridiscentes', domain:'animal' },
  { id:'ave_cresta', label:'un ave de cresta luminosa', domain:'animal' },
  { id:'entidad_geometrica', label:'una entidad de geometría inestable', domain:'alien' },
  { id:'nube_sensorial', label:'una nube sensorial con núcleo cristalino', domain:'alien' },
  { id:'nino_sombra', label:'un niño de contornos difusos', domain:'humana' },
  { id:'anciano_menudo', label:'un anciano diminuto de mirada antigua', domain:'humana' },
  { id:'llama_fria', label:'una llama fría que no quema', domain:'paranormal' },
  { id:'muneco_animado', label:'un muñeco de trapo animado', domain:'paranormal' },
];

const TRAIT_POOL = [
  { id:'gloton', label:'Glotón', desc:'el hambre le pesa más rápido', decay:{hambre:1.35} },
  { id:'sociable', label:'Sociable', desc:'necesita compañía seguido, pero el vínculo crece más rápido', decay:{social:1.3}, bondMult:1.25 },
  { id:'resiliente', label:'Resiliente', desc:'aguanta mejor físicamente', decay:{salud:0.7} },
  { id:'sensible', label:'Sensible', desc:'le afecta más la soledad y el descuido', decay:{cordura:1.35} },
  { id:'longevo', label:'Longevo', desc:'vive más que el promedio', maxAgeMult:1.35 },
  { id:'independiente', label:'Independiente', desc:'lleva mejor estar solo', decay:{social:0.7} },
  { id:'fragil', label:'Frágil', desc:'enferma con más facilidad', illnessMult:1.4 },
  { id:'limpio', label:'Ordenado', desc:'ensucia menos', decay:{higiene:0.75} },
];
const CURSE_TRAIT = { id:'trauma_fundacional', label:'Trauma de fábrica', desc:'nació desconfiado — el vínculo cuesta más', decay:{cordura:1.5}, bondMult:0.75 };
const BLESSING_TRAIT = { id:'bendicion_heredada', label:'Bendición heredada', desc:'una vida anterior descansó en paz — todo se desgasta más lento' };

const BASE_DECAY_PER_HOUR = { hambre:1.0, energia:0.8, higiene:0.6, social:0.5, salud:0.6, cordura:0.35 };
const STAGE_THRESHOLDS = [
  { id:'cria', label:'Cría', frac:0.0 },
  { id:'joven', label:'Joven', frac:0.15 },
  { id:'adulta', label:'Adulta', frac:0.4 },
  { id:'anciana', label:'Anciana', frac:0.78 },
];

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function generatePet(gen, inheritedModifiers){
  const species = pick(SPECIES_POOL);
  const numTraits = 1 + (Math.random()<0.5?1:0);
  const traits = []; const pool = TRAIT_POOL.slice();
  for(let i=0;i<numTraits && pool.length;i++){ const idx=Math.floor(Math.random()*pool.length); traits.push(pool.splice(idx,1)[0]); }
  if(inheritedModifiers && inheritedModifiers.curse) traits.push(CURSE_TRAIT);
  if(inheritedModifiers && inheritedModifiers.blessing) traits.push(BLESSING_TRAIT);

  let maxAgeDays = 8 + Math.random()*7;
  traits.forEach(t=>{ if(t.maxAgeMult) maxAgeDays*=t.maxAgeMult; });

  const needs={}; NEEDS.forEach(n=> needs[n]=80+Math.random()*20);
  let startingBond=0;
  if(inheritedModifiers && inheritedModifiers.blessing) startingBond+=10;
  if(inheritedModifiers && inheritedModifiers.curse) startingBond-=10;

  return {
    gen, id:'g'+gen+'_'+Math.floor(Math.random()*1e9), name:null,
    species, traits, ageDays:0, maxAgeDays, needs,
    illness:null, bondScore:startingBond, careSamples:[], neglectStreakHours:0,
    dead:false, birthTs:Date.now(), lastTick:Date.now(),
    inheritedDecayMult: inheritedModifiers && inheritedModifiers.curse ? 1.2 : (inheritedModifiers && inheritedModifiers.blessing ? 0.85 : 1),
  };
}

function currentStage(pet){
  const frac = pet.ageDays/pet.maxAgeDays; let stage=STAGE_THRESHOLDS[0];
  for(const s of STAGE_THRESHOLDS) if(frac>=s.frac) stage=s;
  return stage;
}
function decayRateFor(pet,need){
  let rate = BASE_DECAY_PER_HOUR[need];
  pet.traits.forEach(t=>{ if(t.decay && t.decay[need]) rate*=t.decay[need]; });
  if(pet.inheritedDecayMult) rate*=pet.inheritedDecayMult;
  const stage=currentStage(pet);
  if(stage.id==='anciana' && need==='energia') rate*=1.3;
  if(stage.id==='cria' && need==='social') rate*=1.2;
  return rate;
}
function healthTargetFor(pet){
  const others=['hambre','energia','higiene','social','cordura'];
  const avg = others.reduce((s,n)=>s+pet.needs[n],0)/others.length;
  const stage=currentStage(pet);
  const ceiling={cria:1.0,joven:1.0,adulta:0.95,anciana:0.72}[stage.id];
  return avg*ceiling;
}
function illnessMultFor(pet){ let m=1; pet.traits.forEach(t=>{ if(t.illnessMult) m*=t.illnessMult; }); return m; }
function rollHours(chancePerHour,hours){ const pFail=Math.pow(1-chancePerHour,hours); return Math.random()>pFail; }

function tick(pet,hours,windowStart,now){
  if(pet.dead || hours<=0) return null;
  pet.ageDays += hours/24;
  if(pet.ageDays>=pet.maxAgeDays) return finalizeDeath(pet, pet.needs.salud>50?'vejez':'vejez_debilitada');

  processEffects(pet, windowStart, now);

  NEEDS.forEach(n=>{ if(n==='salud') return; const rate=decayRateFor(pet,n); pet.needs[n]=clamp(pet.needs[n]-rate*hours,0,100); });

  {
    const target=healthTargetFor(pet); const chaseRate=0.045;
    let resilientMult=1; pet.traits.forEach(t=>{ if(t.decay && t.decay.salud) resilientMult=t.decay.salud; });
    const speed=1-Math.pow(1-chaseRate*(target<pet.needs.salud?(2-resilientMult):1),hours);
    pet.needs.salud=clamp(pet.needs.salud+(target-pet.needs.salud)*speed,0,100);
  }

  if(pet.needs.social<=10 || pet.needs.hambre<=10) pet.needs.cordura=clamp(pet.needs.cordura-0.6*hours,0,100);
  if(pet.needs.cordura<=15) pet.needs.salud=clamp(pet.needs.salud-0.3*hours,0,100);
  if(pet.needs.higiene<=10) pet.needs.salud=clamp(pet.needs.salud-0.25*hours,0,100);

  if(!pet.illness){
    const riskBase=((100-pet.needs.salud)+(100-pet.needs.higiene))/200;
    const chancePerHour=0.004*riskBase*illnessMultFor(pet);
    if(rollHours(chancePerHour,hours)) pet.illness={ severity:15+Math.random()*15 };
  } else {
    pet.illness.severity += (pet.needs.salud<40?2.2:1.1)*hours;
    pet.needs.salud=clamp(pet.needs.salud-0.4*hours,0,100);
    if(pet.illness.severity>=100) return finalizeDeath(pet,'enfermedad');
  }

  const criticalCount=NEEDS.filter(n=>pet.needs[n]<=3).length;
  if(criticalCount>=2) pet.neglectStreakHours+=hours; else pet.neglectStreakHours=Math.max(0,pet.neglectStreakHours-hours*2);
  if(pet.neglectStreakHours>=20){ if(rollHours(0.02,hours)) return finalizeDeath(pet,'negligencia'); }

  const q=NEEDS.reduce((s,n)=>s+pet.needs[n],0)/(NEEDS.length*100);
  pet.careSamples.push(q); if(pet.careSamples.length>500) pet.careSamples.shift();
  return null;
}

// Effects apply gradually over real wall-clock time (e.g. "10 minutos digiriendo la comida"),
// integrated against the actual overlap between [windowStart, now] and the effect's own window —
// so a big catch-up jump after being away doesn't apply a huge action bonus, only what actually
// finished during that window.
function processEffects(entity, windowStart, now){
  if(!entity.effects) entity.effects=[];
  entity.effects = entity.effects.filter(e=>{
    const effEnd = e.startTs + e.durationMs;
    const overlapStart = Math.max(e.startTs, windowStart);
    const overlapEnd = Math.min(effEnd, now);
    if(overlapEnd > overlapStart){
      const frac = (overlapEnd-overlapStart)/e.durationMs;
      const delta = e.amount*frac;
      if(e.stat==='illness'){ if(entity.illness){ entity.illness.severity=clamp(entity.illness.severity+delta,0,100); if(entity.illness.severity<=0) entity.illness=null; } }
      else if(e.stat==='unrest'){ entity.unrest=clamp(entity.unrest+delta,0,100); }
      else { entity.needs[e.stat]=clamp(entity.needs[e.stat]+delta,0,100); }
    }
    return now < effEnd;
  });
}
function hasActiveEffect(entity, stat, now){
  return (entity.effects||[]).some(e=>e.stat===stat && now < e.startTs+e.durationMs);
}
function activeEffectRemaining(entity, stat, now){
  const e=(entity.effects||[]).find(e=>e.stat===stat && now < e.startTs+e.durationMs);
  return e ? Math.ceil((e.startTs+e.durationMs-now)/60000) : 0;
}

const ACTION_DEFS = {
  alimentar: { stat:'hambre', amount:35, durationMin:10 },
  jugar: { stat:'social', amount:30, durationMin:10, side:{stat:'energia',amount:-8,durationMin:10}, bond:4 },
  limpiar: { stat:'higiene', amount:40, durationMin:6 },
  dormir: { stat:'energia', amount:45, durationMin:25 },
  consolar: { stat:'cordura', amount:25, durationMin:10, bond:3 },
  curar: { stat:'salud', amount:15, durationMin:20, side:{stat:'illness',amount:-40,durationMin:20} },
};
function applyAction(pet,action,now){
  now = now || Date.now();
  const def = ACTION_DEFS[action];
  if(!def) return { ok:false };
  if(action==='curar' && !pet.illness) return { ok:false, reason:'sin_enfermedad' };
  if(hasActiveEffect(pet, def.stat, now)) return { ok:false, reason:'en_efecto' };
  if(def.side && hasActiveEffect(pet, def.side.stat, now)) return { ok:false, reason:'en_efecto' };
  if(!pet.effects) pet.effects=[];
  pet.effects.push({ stat:def.stat, amount:def.amount, startTs:now, durationMs:def.durationMin*60000 });
  if(def.side) pet.effects.push({ stat:def.side.stat, amount:def.side.amount, startTs:now, durationMs:def.side.durationMin*60000 });
  if(def.bond) bumpBond(pet, def.bond);
  return { ok:true };
}
function bumpBond(pet,amt){ let mult=1; pet.traits.forEach(t=>{ if(t.bondMult) mult*=t.bondMult; }); pet.bondScore=clamp(pet.bondScore+amt*mult,-100,100); }
function finalizeDeath(pet,cause){
  pet.dead=true;
  const avgCare=pet.careSamples.length? pet.careSamples.reduce((a,b)=>a+b,0)/pet.careSamples.length : 0.5;
  return { deathEvent:{ cause, bondScore:pet.bondScore, avgCare, ageDays:pet.ageDays, gen:pet.gen } };
}

function reincarnationRoll(deathEvent){
  const { cause, bondScore } = deathEvent;
  let baseChance;
  if(cause==='vejez') baseChance=0.06;
  else if(cause==='vejez_debilitada') baseChance=0.12;
  else if(cause==='enfermedad') baseChance=0.22;
  else baseChance=0.42;
  if(Math.random()>=baseChance) return { returns:false };
  let type;
  if(cause==='vejez' && bondScore>=20) type='guardian';
  else if(bondScore<-10 || cause==='negligencia') type='vengativo';
  else type='inquieto';
  const startUnrest = type==='vengativo'? 55+Math.random()*20 : type==='inquieto'? 30+Math.random()*20 : 10+Math.random()*15;
  return { returns:true, type, startUnrest };
}
function createParanormalState(reinc,deathEvent){
  return { active:true, type:reinc.type, unrest:reinc.startUnrest, memory:100, deathCause:deathEvent.cause, hoursSinceInteraction:0, lastTick:Date.now(), effects:[] };
}
const UNREST_GROWTH_PER_HOUR={ guardian:0.15, inquieto:0.35, vengativo:0.6 };
const MEMORY_DECAY_BASE=0.12;
function tickParanormal(state,hours,windowStart,now){
  if(hours<=0) return null;
  processEffects(state, windowStart, now);
  state.unrest=clamp(state.unrest+UNREST_GROWTH_PER_HOUR[state.type]*hours,0,100);
  state.hoursSinceInteraction+=hours;
  const neglectMult=state.hoursSinceInteraction>48?2.2:1;
  state.memory=clamp(state.memory-MEMORY_DECAY_BASE*neglectMult*hours,0,100);
  if(state.memory<=0) return { ending:'desvanecido' };
  if(state.unrest>=100) return { ending:'malevolo' };
  return null;
}
const PARANORMAL_ACTION_DEFS = {
  escuchar: { amount:-10, durationMin:12 },
  ofrenda: { amount:-25, durationMin:20 },
};
function applyParanormalAction(state,action,now){
  now = now || Date.now();
  if(action==='ritual_cierre'){
    if(state.unrest<=20) return { ending:'paz' };
    return { ok:false, reason:'inquietud_alta' };
  }
  const def = PARANORMAL_ACTION_DEFS[action];
  if(!def) return { ok:false };
  if(hasActiveEffect(state,'unrest',now)) return { ok:false, reason:'en_efecto' };
  if(!state.effects) state.effects=[];
  state.effects.push({ stat:'unrest', amount:def.amount, startTs:now, durationMs:def.durationMin*60000 });
  state.hoursSinceInteraction=0; state.memory=clamp(state.memory+6,0,100);
  return { ok:true };
}
function inheritedModifiersFromEnding(ending){
  if(ending==='paz') return { blessing:true, curse:false };
  if(ending==='malevolo') return { blessing:false, curse:true };
  return { blessing:false, curse:false };
}

// ======================= ESTADO / PERSISTENCIA =======================
const SAVE_KEY='legado_save_v1';
let STATE=null;

function loadState(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw) STATE=JSON.parse(raw);
  }catch(e){ console.warn('No se pudo leer el guardado', e); }
  if(!STATE){
    STATE={ lineage:[], screen:'intro', current:{ mode:null, pet:null, paranormal:null, pendingModifiers:null } };
  }
}
function saveState(){ localStorage.setItem(SAVE_KEY, JSON.stringify(STATE)); }

function catchUpTime(){
  const cur=STATE.current;
  const now=Date.now();
  if(cur.mode==='vida' && cur.pet && !cur.pet.dead){
    const windowStart=cur.pet.lastTick;
    const hours=(now-windowStart)/3600000;
    if(hours>0){
      const res=tick(cur.pet,hours,windowStart,now);
      cur.pet.lastTick=now;
      if(res && res.deathEvent){ handleDeath(res.deathEvent); }
    }
  } else if(cur.mode==='paranormal' && cur.paranormal && cur.paranormal.active){
    const windowStart=cur.paranormal.lastTick;
    const hours=(now-windowStart)/3600000;
    if(hours>0){
      const res=tickParanormal(cur.paranormal,hours,windowStart,now);
      cur.paranormal.lastTick=now;
      if(res && res.ending){ handleParanormalEnding(res.ending); }
    }
  }
}

function handleDeath(deathEvent){
  const cur=STATE.current;
  STATE.lineage.push({
    gen:cur.pet.gen, name:cur.pet.name, speciesLabel:cur.pet.species.label,
    cause:deathEvent.cause, ageDays:deathEvent.ageDays, bondScore:deathEvent.bondScore, forgotten:false,
  });
  cur.mode='requiem'; cur.lastDeathEvent=deathEvent;
  saveState();
}

function proceedAfterRequiem(){
  const cur=STATE.current;
  const reinc=reincarnationRoll(cur.lastDeathEvent);
  if(reinc.returns){
    cur.paranormal=createParanormalState(reinc, cur.lastDeathEvent);
    cur.mode='paranormal';
  } else {
    cur.pendingModifiers=null;
    cur.mode='nueva_vida';
  }
  saveState();
}

function handleParanormalEnding(ending){
  const cur=STATE.current;
  const last=STATE.lineage[STATE.lineage.length-1];
  if(ending==='desvanecido' && last){ last.forgotten=true; last.name='???'; last.speciesLabel='una presencia que ya no se recuerda'; }
  if(last) last.paranormalEnding=ending;
  cur.pendingModifiers=inheritedModifiersFromEnding(ending);
  cur.paranormal=null;
  cur.mode='final_paranormal';
  cur.lastEnding=ending;
  saveState();
}

function startNewLife(name){
  const cur=STATE.current;
  const gen=(cur.pet?cur.pet.gen:0)+1;
  const pet=generatePet(gen, cur.pendingModifiers);
  pet.name=name && name.trim() ? name.trim() : 'Sin nombre';
  cur.pet=pet; cur.mode='vida'; cur.pendingModifiers=null;
  saveState();
}

// ======================= RENDER =======================
const app=document.getElementById('app');

function needColor(v){ if(v<=20) return 'var(--danger)'; if(v<=45) return 'var(--warn)'; return 'var(--good)'; }
function avgWellbeing(pet){ return NEEDS.reduce((s,n)=>s+pet.needs[n],0)/NEEDS.length; }

function statusText(pet){
  const n=pet.needs;
  const lows=NEEDS.filter(k=>n[k]<=25);
  if(pet.illness) return 'se ve débil, respira con esfuerzo.';
  if(lows.length>=3) return 'apenas reacciona. algo anda muy mal.';
  if(n.hambre<=20) return 'tiene hambre de verdad.';
  if(n.social<=20) return 'está retraído, evita el contacto.';
  if(n.energia<=20) return 'se mueve despacio, agotado.';
  if(n.higiene<=20) return 'está incómodo, necesita que lo limpies.';
  if(n.cordura<=25) return 'se lo ve inquieto, alterado.';
  const avg=avgWellbeing(pet);
  if(avg>=80) return 'se ve tranquilo y contento.';
  if(avg>=55) return 'está bien, sin sobresaltos.';
  return 'está pasándola regular.';
}
function bondLabel(b){
  if(b>=50) return 'profundo';
  if(b>=15) return 'cálido';
  if(b>=-10) return 'tibio';
  if(b>=-40) return 'distante';
  return 'roto';
}
function stageLabel(pet){ return currentStage(pet).label; }

let uiOverlay = null; // 'lineage' when the lineage view is open over the main screen

function render(){
  if(uiOverlay==='lineage'){ renderLineageView(); return; }
  document.body.classList.toggle('paranormal', STATE.current.mode==='paranormal');
  const cur=STATE.current;
  if(STATE.screen==='intro' && !cur.pet){ renderIntro(); return; }
  if(cur.mode==='vida') renderVida();
  else if(cur.mode==='requiem') renderRequiem();
  else if(cur.mode==='paranormal') renderParanormal();
  else if(cur.mode==='final_paranormal') renderFinalParanormal();
  else if(cur.mode==='nueva_vida') renderNuevaVida();
  else renderIntro();
}

function renderIntro(){
  app.innerHTML = `
    <p class="eyebrow">legado</p>
    <h1 class="name">algo está por nacer</h1>
    <div class="panel">
      <p>Vas a criar una vida — no sabés qué forma va a tomar hasta que nazca. Tiene necesidades reales, y el tiempo pasa aunque no estés mirando. Si muere mal, puede que no se vaya del todo.</p>
      <input type="text" id="nameInput" placeholder="Nombrale algo">
      <button class="act primary" onclick="onIntroStart()">Que nazca</button>
    </div>
    ${lineageBlock()}
  `;
}
function onIntroStart(){
  const name=document.getElementById('nameInput').value;
  const pet=generatePet(1,null);
  pet.name=name && name.trim() ? name.trim() : 'Sin nombre';
  STATE.current={ mode:'vida', pet, paranormal:null, pendingModifiers:null };
  STATE.screen='juego';
  saveState(); render();
}

function actBtnLabel(pet, now, stat, label){
  const mins = activeEffectRemaining(pet, stat, now);
  return mins>0 ? `${label} <span style="opacity:.6">(${mins}m)</span>` : label;
}
function renderVida(){
  const pet=STATE.current.pet;
  const now=Date.now();
  const wb=avgWellbeing(pet);
  const blobColor = wb<=25?'var(--danger)': wb<=50?'var(--warn)':'var(--good)';
  const busy = (stat)=> hasActiveEffect(pet, stat, now);
  app.innerHTML = `
    <div class="topbar">
      <div>
        <p class="eyebrow">generación ${pet.gen}</p>
        <h1 class="name">${escapeHtml(pet.name)}</h1>
        <p class="meta-line">${pet.species.label} · ${stageLabel(pet)} · ${pet.ageDays.toFixed(1)}d de ${pet.maxAgeDays.toFixed(1)}d</p>
        <div class="traits">${pet.traits.map(t=>`<span class="trait ${t.id==='trauma_fundacional'?'trait-curse':t.id==='bendicion_heredada'?'trait-blessing':''}"><b>${t.label}</b>${t.desc}</span>`).join('')}</div>
      </div>
      <button class="iconbtn" onclick="openLineage()">Linaje</button>
    </div>

    <div class="stage"><div class="creature-wrap stage-${currentStage(pet).id}"><div class="blob domain-${pet.species.domain}" style="--blob-color:${blobColor}"></div></div></div>
    <p class="status-text">${statusText(pet)}</p>

    ${pet.illness ? `<div class="illness-banner">Está enfermo (severidad ${Math.round(pet.illness.severity)}%). Necesita cuidado o va a empeorar.</div>` : ''}

    <div class="needs">
      ${NEEDS.map(n=>`
        <div class="need-row">
          <div class="need-label">${NEED_LABELS[n]}</div>
          <div class="need-track"><div class="need-fill" style="width:${pet.needs[n]}%; background:${needColor(pet.needs[n])}"></div></div>
          ${activeEffectRemaining(pet,n,now)>0?`<div style="font-size:11px;color:var(--accent);flex-shrink:0;">⏳${activeEffectRemaining(pet,n,now)}m</div>`:''}
        </div>`).join('')}
    </div>

    <p class="bond-line">Vínculo: <b>${bondLabel(pet.bondScore)}</b></p>

    <div class="actions">
      <button class="act" ${busy('hambre')?'disabled':''} onclick="doAction('alimentar')">${actBtnLabel(pet,now,'hambre','Alimentar')}</button>
      <button class="act" ${busy('social')||busy('energia')?'disabled':''} onclick="doAction('jugar')">${actBtnLabel(pet,now,'social','Jugar')}</button>
      <button class="act" ${busy('higiene')?'disabled':''} onclick="doAction('limpiar')">${actBtnLabel(pet,now,'higiene','Limpiar')}</button>
      <button class="act" ${busy('energia')?'disabled':''} onclick="doAction('dormir')">${actBtnLabel(pet,now,'energia','Dejar dormir')}</button>
      <button class="act" ${busy('cordura')?'disabled':''} onclick="doAction('consolar')">${actBtnLabel(pet,now,'cordura','Consolar')}</button>
      <button class="act ${pet.illness?'primary':''}" ${(!pet.illness||busy('salud'))?'disabled':''} onclick="doAction('curar')">${actBtnLabel(pet,now,'salud','Curar')}</button>
    </div>

    ${devBlock()}
  `;
}
function doAction(action){
  catchUpTime();
  if(STATE.current.mode!=='vida') { render(); return; }
  applyAction(STATE.current.pet, action, Date.now());
  saveState(); render();
}

function renderRequiem(){
  const pet=STATE.current.pet; const de=STATE.current.lastDeathEvent;
  const causeText={
    vejez:'Murió de vieja, en paz.',
    vejez_debilitada:'Murió de vieja, ya muy debilitada.',
    enfermedad:'La enfermedad avanzó demasiado y no resistió.',
    negligencia:'El cuerpo no aguantó tanto descuido.',
  }[de.cause] || 'Se apagó.';
  app.innerHTML = `
    <p class="eyebrow">réquiem · generación ${de.gen}</p>
    <h1 class="name">${escapeHtml(pet.name)}</h1>
    <div class="panel">
      <p>${causeText}</p>
      <p>Vivió ${de.ageDays.toFixed(1)} días. Vínculo al final: <b style="color:var(--text)">${bondLabel(de.bondScore)}</b>. Calidad de cuidado promedio: ${Math.round(de.avgCare*100)}%.</p>
      <button class="act primary" onclick="onContinueRequiem()">Continuar</button>
    </div>
  `;
}
function onContinueRequiem(){ proceedAfterRequiem(); render(); }

function renderParanormal(){
  const st=STATE.current.paranormal;
  const now=Date.now();
  const typeLabel={ guardian:'un guardián sereno', inquieto:'una presencia inquieta', vengativo:'una presencia furiosa' }[st.type];
  const causeFlavor={
    vejez_debilitada:'ofrenda de descanso',
    enfermedad:'ofrenda de remedio',
    negligencia:'ofrenda de compañía',
  }[st.deathCause] || 'ofrenda';
  const blobColor = st.unrest>=70?'var(--danger)': st.unrest>=35?'var(--warn)':'var(--good)';
  const busy = hasActiveEffect(st,'unrest',now);
  const mins = activeEffectRemaining(st,'unrest',now);
  app.innerHTML = `
    <div class="topbar">
      <div>
        <p class="eyebrow">no se fue del todo</p>
        <h1 class="name">${escapeHtml(STATE.lineage[STATE.lineage.length-1].name)}</h1>
        <p class="meta-line">volvió como ${typeLabel}</p>
      </div>
      <button class="iconbtn" onclick="openLineage()">Linaje</button>
    </div>

    <div class="stage"><div class="creature-wrap"><div class="blob domain-paranormal" style="--blob-color:${blobColor}"></div></div></div>
    <p class="status-text">${st.unrest>=70?'algo se está retorciendo ahí dentro.':st.unrest>=35?'todavía no descansa.':'parece estar escuchando.'}</p>

    <div class="needs">
      <div class="need-row"><div class="need-label">Inquietud</div><div class="need-track"><div class="need-fill" style="width:${st.unrest}%; background:${st.unrest>=70?'var(--danger)':st.unrest>=35?'var(--warn)':'var(--good)'}"></div></div>${mins>0?`<div style="font-size:11px;color:var(--accent);flex-shrink:0;">⏳${mins}m</div>`:''}</div>
      <div class="need-row"><div class="need-label">Memoria</div><div class="need-track"><div class="need-fill" style="width:${st.memory}%; background:var(--accent)"></div></div></div>
    </div>

    <div class="actions">
      <button class="act" ${busy?'disabled':''} onclick="doParanormalAction('escuchar')">Escuchar</button>
      <button class="act" ${busy?'disabled':''} onclick="doParanormalAction('ofrenda')">${cap(causeFlavor)}</button>
      <button class="act primary" ${st.unrest<=20?'':'disabled'} onclick="doParanormalAction('ritual_cierre')">Ritual de cierre</button>
    </div>
    <p class="meta-line">La inquietud baja despacio, con atención sostenida en el tiempo — no de golpe. El ritual de cierre solo funciona cuando ya está bien calma.</p>

    ${devBlockParanormal()}
  `;
}
function doParanormalAction(action){
  catchUpTime();
  if(STATE.current.mode!=='paranormal'){ render(); return; }
  const res=applyParanormalAction(STATE.current.paranormal, action, Date.now());
  if(res && res.ending){ handleParanormalEnding(res.ending); }
  saveState(); render();
}

function renderFinalParanormal(){
  const ending=STATE.current.lastEnding;
  const txt={
    paz:{ title:'Descansó en paz', body:'Lo que quedaba de esa vida por fin se aquietó. La próxima generación va a nacer con algo bueno de esto — una bendición callada.' },
    malevolo:{ title:'Se volvió algo más', body:'La inquietud no encontró salida y se transformó en otra cosa. Va a dejar una marca en lo que venga después — una maldición heredada.' },
    desvanecido:{ title:'Se desvaneció', body:'No fue por dolor ni por paz. Simplemente, con el tiempo, dejó de ser recordado. Ya no queda casi nada de esa vida en el linaje.' },
  }[ending];
  app.innerHTML = `
    <p class="eyebrow">final</p>
    <h1 class="name">${txt.title}</h1>
    <div class="panel">
      <p>${txt.body}</p>
      <button class="act primary" onclick="onContinueFinal()">Continuar</button>
    </div>
  `;
}
function onContinueFinal(){ STATE.current.mode='nueva_vida'; saveState(); render(); }

function renderNuevaVida(){
  const cur=STATE.current;
  const mod=cur.pendingModifiers;
  const modText = mod && mod.blessing ? 'Esta próxima vida nace con una bendición: todo se le va a desgastar más lento.'
    : mod && mod.curse ? 'Esta próxima vida nace con una carga: todo se le va a desgastar más rápido, y va a desconfiar más fácil.'
    : 'Esta próxima vida nace sin marcas del pasado.';
  app.innerHTML = `
    <p class="eyebrow">algo nuevo está por nacer</p>
    <h1 class="name">generación ${(cur.pet?cur.pet.gen:0)+1}</h1>
    <div class="panel">
      <p>${modText}</p>
      <input type="text" id="nameInput2" placeholder="Nombrale algo">
      <button class="act primary" onclick="onStartNewLife()">Que nazca</button>
    </div>
    ${lineageBlock()}
  `;
}
function onStartNewLife(){
  const name=document.getElementById('nameInput2').value;
  startNewLife(name); render();
}

function lineageBlock(){
  if(!STATE.lineage.length) return '';
  return `<div class="panel"><h2>Linaje</h2>${STATE.lineage.slice().reverse().map(l=>`
    <div class="lineage-item ${l.forgotten?'forgotten':''}">
      <span class="g">Gen ${l.gen}</span> — ${escapeHtml(l.name)}, ${l.speciesLabel}.
      ${l.forgotten?'':`Vivió ${l.ageDays.toFixed(1)}d. ${causeShort(l.cause)}.${l.paranormalEnding?' Final: '+endingShort(l.paranormalEnding)+'.':''}`}
    </div>`).join('')}</div>`;
}
function causeShort(c){ return { vejez:'Murió de vieja, en paz', vejez_debilitada:'Murió de vieja, debilitada', enfermedad:'Murió de enfermedad', negligencia:'Murió por negligencia' }[c] || ''; }
function endingShort(e){ return { paz:'descansó en paz', malevolo:'se volvió maligna', desvanecido:'se desvaneció' }[e] || ''; }

function openLineage(){
  uiOverlay='lineage';
  renderLineageView();
}
function closeLineage(){
  uiOverlay=null;
  render();
}
function renderLineageView(){
  app.innerHTML = `
    <p class="eyebrow">linaje completo</p>
    <h1 class="name">lo que quedó</h1>
    <button class="iconbtn" style="margin-bottom:16px" onclick="closeLineage()">← Volver</button>
    ${lineageBlock() || '<p class="meta-line">Todavía no hay historia.</p>'}
  `;
}

function devBlock(){
  return `<details class="devbox"><summary>Herramientas de prueba</summary>
    <div class="devrow">
      <button onclick="devAdvance(1)">+1h</button>
      <button onclick="devAdvance(6)">+6h</button>
      <button onclick="devAdvance(24)">+24h</button>
      <button onclick="devAdvance(72)">+72h</button>
      <button onclick="devReset()">Reiniciar todo</button>
    </div>
  </details>`;
}
function devBlockParanormal(){
  return `<details class="devbox"><summary>Herramientas de prueba</summary>
    <div class="devrow">
      <button onclick="devAdvanceParanormal(6)">+6h</button>
      <button onclick="devAdvanceParanormal(24)">+24h</button>
      <button onclick="devAdvanceParanormal(72)">+72h</button>
      <button onclick="devReset()">Reiniciar todo</button>
    </div>
  </details>`;
}
function devAdvance(hours){
  const pet=STATE.current.pet;
  const windowStart=pet.lastTick;
  const now=windowStart+hours*3600000;
  const res=tick(pet,hours,windowStart,now);
  pet.lastTick=now;
  if(res && res.deathEvent) handleDeath(res.deathEvent);
  saveState(); render();
}
function devAdvanceParanormal(hours){
  const st=STATE.current.paranormal;
  const windowStart=st.lastTick;
  const now=windowStart+hours*3600000;
  const res=tickParanormal(st,hours,windowStart,now);
  st.lastTick=now;
  if(res && res.ending) handleParanormalEnding(res.ending);
  saveState(); render();
}
function devReset(){
  if(confirm('Esto borra todo el linaje y empieza de cero. ¿Seguro?')){
    localStorage.removeItem(SAVE_KEY); loadState(); render();
  }
}

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ======================= INICIO =======================
loadState();
catchUpTime();
saveState();
render();

setInterval(()=>{
  catchUpTime(); saveState();
  if(uiOverlay) return; // no molestar una vista abierta (ej. linaje)
  if(STATE.current.mode==='vida' || STATE.current.mode==='paranormal') render();
}, 5000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ catchUpTime(); saveState(); render(); } });
</script>
</body>
</html>
